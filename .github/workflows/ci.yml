name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: posts_test
          # A disposable CI-only server bound to the runner, with no credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/posts_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go tool gqlgen generate && git diff --exit-code
      - run: docker build -t posts-comments-service:ci .
