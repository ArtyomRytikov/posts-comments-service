name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: posts_test
          # A disposable CI-only server bound to the runner, with no credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/posts_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -v -count=1 ./...
      - run: go build ./...
      - run: go tool gqlgen generate && git diff --exit-code
      - run: docker build -t posts-comments-service:ci .
      - name: Run container with in-memory storage
        run: |
          docker run -d --name posts-memory -p 127.0.0.1:18080:8080 posts-comments-service:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz; then break; fi
            sleep 1
          done
          TEST_SERVER_URL=http://127.0.0.1:18080 go test -race -v -count=1 ./internal/api -run '^TestRunningServerWorkflow$'
      - name: Run Compose with PostgreSQL storage
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          APP_PORT: "18081"
        run: |
          docker compose up --build --wait --wait-timeout 120
          TEST_SERVER_URL=http://127.0.0.1:18081 go test -race -v -count=1 ./internal/api -run '^TestRunningServerWorkflow$'
      - name: Container logs and cleanup
        if: always()
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          APP_PORT: "18081"
        run: |
          docker logs posts-memory || true
          docker compose logs
          docker rm -f posts-memory || true
          docker compose down -v
